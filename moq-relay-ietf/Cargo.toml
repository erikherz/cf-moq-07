[package]
name = "moq-relay-ietf"
description = "Media over QUIC"
authors = ["Luke Curley"]
repository = "https://github.com/englishm/moq-rs"
license = "MIT OR Apache-2.0"

version = "0.7.4"
edition = "2021"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[dependencies]
moq-transport = { path = "../moq-transport", version = "0.10" }
moq-native-ietf = { path = "../moq-native-ietf", version = "0.5" }
moq-api = { path = "../moq-api", version = "0.2" }

# WebSocket polyfill for Safari support
web-transport-ws = { git = "https://github.com/moq-dev/web-transport", branch = "main" }
web-transport = { workspace = true }
tokio-tungstenite = "0.24"

# QUIC
url = "2"

# Async stuff
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Web server to serve the fingerprint and WebSocket connections
axum = { version = "0.7", features = ["tokio", "ws"] }
tower-http = { version = "0.5", features = ["cors"] }
hex = "0.4"

# TLS and HTTP for WebSocket server
tokio-rustls = "0.26"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"

# Error handling
anyhow = { version = "1", features = ["backtrace"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
log = { workspace = true }
env_logger = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
